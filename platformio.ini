; ESP32 board check + BLE keyboard HID host

; NimBLE 1.4.x needs Arduino-ESP32 2.x (platform 6.x). Platform 8 / Arduino 3
; aborts in NimBLEDevice::init with ESP_ERR_INVALID_STATE (BT controller).
[env:diag]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<diag_main.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:ble_keyboard]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.3
    madhephaestus/ESP32Servo @ ^3.0.5
build_src_filter = +<ble_keyboard_main.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER

; BLE keyboard + single servo on GPIO27 (swap signal wire to test each MG996R)
[env:ble_servo_test]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.3
    madhephaestus/ESP32Servo @ ^3.0.5
build_src_filter = +<ble_keyboard_main.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER
    -DSERVO_SINGLE_PIN=27

[env:servo_test]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5
build_src_filter = +<servo_test_main.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
